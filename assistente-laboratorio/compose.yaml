services:
  server-mcp:
    build: .
    command: ["python", "-m", "assistente.server_mcp"]
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8001"
      NOTE_DB_PATH: /data/note.db
      # Resource utente://preferenze: file dell'host, modificabile senza ricostruire l'immagine.
      PREFERENZE_PATH: /preferenze/preferenze.json
      # Usato solo dal controllo di salute (dentro il container).
      MCP_URL: http://localhost:8001/mcp
    volumes:
      - dati-note:/data
      # Cartella e non singolo file: se il file manca Docker non crea una cartella al suo posto,
      # e le modifiche salvate da qualunque editor si vedono subito (sola lettura).
      - ./data:/preferenze:ro
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      # Vera discovery MCP: una semplice porta aperta non basta.
      test: ["CMD", "python", "-m", "assistente.verifica_mcp"]
      interval: 10s
      timeout: 8s
      start_period: 10s
      retries: 3

  servizi-http:
    build: .
    command: ["python", "-m", "assistente.servizi_http"]
    environment:
      SERVIZI_HOST: 0.0.0.0
      SERVIZI_PORT: "8000"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      # Richiesta HTTP reale a /salute (non una semplice connessione TCP).
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/salute', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3

  agente:
    # Step 6: l'agente come servizio HTTP; la CLI (`assistente`) è un suo client.
    build: .
    command: ["python", "-m", "assistente.servizio_agente"]
    env_file: .env
    ports:
      - "127.0.0.1:8002:8002"
    depends_on:
      server-mcp:
        # Mai service_healthy: con il server fermo o non sano l'agente deve partire lo stesso
        # (avvio ridotto, solo strumenti locali).
        condition: service_started
      servizi-http:
        # Anche qui service_started: gli strumenti HTTP sono sempre registrati e un servizio
        # spento dà `Errore: servizio non raggiungibile ...` alla chiamata.
        condition: service_started
    environment:
      # Dentro il container "localhost" è il container stesso: si punta all'host.
      LM_STUDIO_BASE_URL: ${LM_STUDIO_DOCKER_URL:-http://host.docker.internal:1234/v1}
      MCP_URL: ${MCP_DOCKER_URL:-http://server-mcp:8001/mcp}
      # Secondi di attesa all'avvio perché il server MCP risponda (0 = nessuna attesa).
      MCP_ATTESA_AVVIO: ${MCP_ATTESA_AVVIO:-20}
      SERVIZI_BASE_URL: ${SERVIZI_DOCKER_URL:-http://servizi-http:8000}
      AGENTE_HOST: 0.0.0.0
      AGENTE_PORT: "8002"
    healthcheck:
      # Il servizio risponde (anche in avvio ridotto): /openapi.json non dipende da MCP né dal modello.
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/openapi.json', timeout=3).status == 200 else 1)"
      interval: 5s
      timeout: 5s
      start_period: 40s
      retries: 3

  assistente:
    # CLI: conserva la conversazione e la manda all'agente a ogni turno.
    build: .
    stdin_open: true
    tty: true
    depends_on:
      agente:
        # L'agente aspetta fino a MCP_ATTESA_AVVIO secondi prima di ascoltare: la CLI parte quando risponde.
        condition: service_healthy
    environment:
      AGENTE_URL: http://agente:8002

  postgres:
    # Step 7: database delle chat del back-end (il back-end per ora si avvia in locale).
    image: postgres:17.6
    # POSTGRES_USER, POSTGRES_PASSWORD e POSTGRES_DB da .env (credenziali mai nel file Compose).
    env_file: .env
    volumes:
      - dati-postgres:/var/lib/postgresql/data
    ports:
      # 5433 sull'host: la 5432 può essere occupata da un PostgreSQL installato localmente.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dati-note:
  dati-postgres:
