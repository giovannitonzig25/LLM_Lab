services:
  server-mcp:
    build: .
    command: ["python", "-m", "assistente.server_mcp"]
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8001"
      NOTE_DB_PATH: /data/note.db
      # Resource utente://preferenze: file dell'host, modificabile senza ricostruire l'immagine.
      PREFERENZE_PATH: /preferenze/preferenze.json
      # Usato solo dal controllo di salute (dentro il container).
      MCP_URL: http://localhost:8001/mcp
    volumes:
      - dati-note:/data
      # Cartella e non singolo file: se il file manca Docker non crea una cartella al suo posto,
      # e le modifiche salvate da qualunque editor si vedono subito (sola lettura).
      - ./data:/preferenze:ro
    # Step 9: nessuna porta sull'host, raggiungibile solo dall'agente sulla rete interna.
    healthcheck:
      # Vera discovery MCP: una semplice porta aperta non basta.
      test: ["CMD", "python", "-m", "assistente.verifica_mcp"]
      interval: 10s
      timeout: 8s
      start_period: 10s
      retries: 3

  servizi-http:
    build: .
    command: ["python", "-m", "assistente.servizi_http"]
    environment:
      SERVIZI_HOST: 0.0.0.0
      SERVIZI_PORT: "8000"
    # Step 9: nessuna porta sull'host, raggiungibile solo dall'agente sulla rete interna.
    healthcheck:
      # Richiesta HTTP reale a /salute (non una semplice connessione TCP).
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/salute', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3

  agente:
    # Step 6: l'agente come servizio HTTP; la CLI (`assistente`) è un suo client.
    build: .
    # Nome fisso: la stessa immagine serve anche alla CLI (`assistente`).
    image: assistente-laboratorio-agente
    command: ["python", "-m", "assistente.servizio_agente"]
    env_file: .env
    # Step 9: l'agente non è esposto; lo raggiungono solo back-end e CLI sulla rete interna.
    depends_on:
      server-mcp:
        # Mai service_healthy: con il server fermo o non sano l'agente deve partire lo stesso
        # (avvio ridotto, solo strumenti locali).
        condition: service_started
      servizi-http:
        # Anche qui service_started: gli strumenti HTTP sono sempre registrati e un servizio
        # spento dà `Errore: servizio non raggiungibile ...` alla chiamata.
        condition: service_started
    environment:
      # Dentro il container "localhost" è il container stesso: si punta all'host.
      LM_STUDIO_BASE_URL: ${LM_STUDIO_DOCKER_URL:-http://host.docker.internal:1234/v1}
      MCP_URL: ${MCP_DOCKER_URL:-http://server-mcp:8001/mcp}
      # Secondi di attesa all'avvio perché il server MCP risponda (0 = nessuna attesa).
      MCP_ATTESA_AVVIO: ${MCP_ATTESA_AVVIO:-20}
      SERVIZI_BASE_URL: ${SERVIZI_DOCKER_URL:-http://servizi-http:8000}
      AGENTE_HOST: 0.0.0.0
      AGENTE_PORT: "8002"
    healthcheck:
      # Il servizio risponde (anche in avvio ridotto): /openapi.json non dipende da MCP né dal modello.
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/openapi.json', timeout=3).status == 200 else 1)"
      interval: 5s
      timeout: 5s
      start_period: 40s
      retries: 3

  assistente:
    # CLI: conserva la conversazione e la manda all'agente a ogni turno.
    # Profilo "cli": `docker compose up` non la avvia; `docker compose run --rm assistente` sì.
    profiles: ["cli"]
    # Immagine dell'agente (stesso Dockerfile), costruita da `docker compose build` anche se il
    # profilo esclude questo servizio: la CLI non resta mai con un'immagine vecchia.
    image: assistente-laboratorio-agente
    pull_policy: never
    stdin_open: true
    tty: true
    depends_on:
      agente:
        # L'agente aspetta fino a MCP_ATTESA_AVVIO secondi prima di ascoltare: la CLI parte quando risponde.
        condition: service_healthy
    environment:
      AGENTE_URL: http://agente:8002

  postgres:
    # Step 7: database delle chat del back-end (servizio `backend` o back-end avviato in locale).
    image: postgres:17.6
    # POSTGRES_USER, POSTGRES_PASSWORD e POSTGRES_DB da .env (credenziali mai nel file Compose).
    env_file: .env
    volumes:
      - dati-postgres:/var/lib/postgresql/data
    ports:
      # 5433 sull'host: la 5432 può essere occupata da un PostgreSQL installato localmente.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    # Step 9: API delle chat; unico punto di contatto del front-end. Nessuna porta sull'host.
    build:
      context: .
      dockerfile: Dockerfile.backend
    # Da .env: POSTGRES_* (per comporre DATABASE_URL) e le variabili facoltative.
    # I valori sotto prevalgono su quelli locali di .env (per esempio DATABASE_URL su 127.0.0.1:5433).
    env_file: .env
    environment:
      # Composta dalle variabili di .env: nessuna credenziale scritta in questo file.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AGENTE_URL: http://agente:8002
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: "8003"
    depends_on:
      postgres:
        # Senza database il back-end esce con codice 1: parte solo a database pronto.
        condition: service_healthy
      agente:
        condition: service_started

  frontend:
    # Step 9: pagina di chat e inoltro /api/... al back-end; unica porta per il browser.
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      BACKEND_URL: http://backend:8003
      FRONTEND_HOST: 0.0.0.0
      FRONTEND_PORT: "8004"
    ports:
      - "127.0.0.1:8004:8004"
    depends_on:
      backend:
        condition: service_started

volumes:
  dati-note:
  dati-postgres:
